# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
application:
  name: Thumbnail Generator
  description: generates a thumbnail for the pennsieve assets from a ome.zarr file
  type: processor
  tags:
    - visualization
runtime:
  cpu: 4096
  memory: 30720
  computeTypes:
    - standard
inputs:
  - name: image
    required: true
    description: An OME-Zarr image store; INPUT_DIR is the store itself.
    mediaTypes:
      - application/vnd.pennsieve.ome-zarr
    formats:
      - format_3915
outputs:
  - name: thumbnail
    description: thumbnail.png in OUTPUT_DIR, THUMBNAIL_SIZE pixels square.
    mediaTypes:
      - image/png
    formats:
      - format_3603
parameters:
  - name: THUMBNAIL_SIZE
    type: integer
    description: width and height of thumbnail. square
    defaultValue: 256
