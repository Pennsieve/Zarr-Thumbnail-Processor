# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
application:
  name: Thumbnail Generator
  description: generates a thumbnail for the pennsieve assets from a ome.zarr file
  type: processor
  tags:
    - visualization
runtime:
  cpu: 4096
  memory: 30720
  computeTypes:
    - standard
parameters:
  - name: THUMBNAIL_SIZE
    type: integer
    description: width and height of thumbnail. square
    defaultValue: 256
